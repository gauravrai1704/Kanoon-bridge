# All tunable values live here. Read them via kanoon_bridge.config.load_config().
# Change values here, never hard-code them in modules.

paths:
  raw: data/raw
  processed: data/processed
  index_dir: data/processed/index
  docs: data/processed/docs.jsonl
  crosswalk: data/crosswalk/ipc_bns.csv
  offence_ids: data/crosswalk/offence_ids.csv
  lexicon_hinglish: data/lexicons/hinglish_legal_terms.csv
  stopwords_hindi: data/lexicons/hindi_stopwords.txt
  stopwords_legal: data/lexicons/legal_stopwords.txt
  stopwords_english: data/lexicons/english_stopwords.txt
  court_to_states: data/lexicons/court_to_states.csv
  embeddings: data/processed/embeddings
  graph: data/processed/citation_graph.json
  results: results
  ilpcsr_dir: data/raw/ilpcsr            # local export of the HF dataset (scripts/00_fetch_data.py)
  bns_dir: data/raw/bns-study-platform    # git clone with BNS bare-act JSON + IPC references
  crosswalk_pdf: data/raw/crosswalk/comparison_summary_BNS_to_IPC.pdf   # optional second source

ilpcsr:
  hf_name: Exploration-Lab/IL-PCSR       # gated: accept terms + `huggingface-cli login`
  splits: {train: train_queries, val: dev_queries, test: test_queries}

legal:
  bns_in_force: "2024-07-01"     # offences on/after this date fall under BNS

text:
  stem_english: true
  stem_hindi: true
  remove_stopwords: true
  phonetic_matching: true
  spelling: true                  # did-you-mean / correction of unseen query words (text/spell.py)
  spelling_weight: 0.9            # weight of an added correction
  spelling_min_df: 2              # a correction must occur in at least this many documents
  spelling_max_query_words: 40    # longer queries (whole judgments, E1) are not spell-checked
  wildcard_weight: 0.8            # weight of each term a wildcard ("extort*") expands to
  wildcard_max_terms: 30          # most frequent expansions kept per wildcard

zones:                            # BM25F zone weights
  facts: 1.0
  arguments: 0.8
  ratio: 1.5
  decision: 1.2
  statute: 1.0                    # statute documents have a single zone
  other: 0.5

bm25:
  k1: 1.6
  b: 0.7
  max_query_terms: 300            # long queries (whole judgments) keep their highest-idf terms

collision:
  date_prior: 0.75                # P(code in force on the date) before looking at context
  context_weight: 4.0             # each matching offence keyword multiplies a reading by (1 + this)
  keep_second_below: 0.7          # also index the runner-up reading when the top one is less sure

statute_bridge:
  top_statutes: 10                # statutes used to expand/filter the precedent query
  boost: 0.3                      # weight of statute-overlap score in precedent ranking

authority:
  lambda: 0.2                     # net score = relevance + lambda * g(d | state)
  binding_weight: 1.0             # Supreme Court or the user's own High Court
  persuasive_weight: 0.4          # other High Courts
  pagerank_damping: 0.85

dense:
  enabled: false
  model: ArkadeepAcharya/NLLB-E5  # Hindi-BEIR (NAACL 2025); check the exact HF id before encoding
  fallback_model: intfloat/multilingual-e5-base   # used automatically if the model above fails to load
  e5_prefixes: true               # "query: " / "passage: " prefixes (E5 family)
  max_paragraph_tokens: 512       # words kept per paragraph before encoding

fusion:
  alpha_default: 0.7              # weight of lexical score when QPP is off
  qpp_gated: true

tiers:
  tier1_authority_quantile: 0.8   # top 20% by authority go to tier 1
  champion_list_size: 50
  min_results_before_tier2: 20

search:
  top_k: 10

similar:                          # "more like this" (rank/similar.py)
  w_text: 0.6                     # the case's own top tf-idf terms as a BM25F query
  w_coupling: 0.25                # version-aware bibliographic coupling (shared offences cited)
  w_cocitation: 0.15              # cited together by the same cases (train-split graph)
  n_terms: 40

# Layer 2: research agent (agent/)
agent:
  enabled: false                  # switch on after the hour-26 gate
  planner: rules                  # rules | llm | hybrid (llm/hybrid need ANTHROPIC_API_KEY)
  llm_model: ""                   # "" = rag default model
  fusion: rrf                     # rrf | combsum
  max_rounds: 2                   # plan + at most one reformulation round
  depth: 50                       # results per sub-query that go into fusion
  rrf_k: 60                       # reciprocal rank fusion constant
  prf_top_docs: 5                 # pseudo-relevance feedback: docs used
  prf_terms: 10                   # pseudo-relevance feedback: terms added
  prf_beta: 0.5                   # weight of each feedback term
  min_results: 10                 # fewer fused precedents than this -> reformulate
  retry_confidence: 0.35          # QPP confidence below this -> reformulate
  boolean_terms: 3                # clauses in the Boolean sub-query
  boolean_min_df: 2               # Boolean terms must occur in at least this many precedents
  facet_weight: 0.8               # fusion weight of the binding-only sub-query

# Layer 3: grounded answers (rag/)
rag:
  enabled: false                  # switch on only if the agent is done by ~hour 30
  model: ""                       # "" = claude-haiku-4-5-20251001 (or env KB_RAG_MODEL); key in .env, never in git
  generator: auto                 # auto (Claude if ANTHROPIC_API_KEY is set, else extractive) | claude | extractive
  max_chunks: 8
  max_chunk_chars: 1200
  support_threshold: 0.2          # tf-idf cosine below this = unsupported sentence
  abstain_min_idf: 0.3            # no query term with idf >= this (log10 N/df) -> abstain
  abstain_min_coverage: 0.5       # idf-weighted share of question terms found in the sources
  abstain_unseen_idf: 3.0         # weight of a question term no index has seen (~ log10 of corpus size)
