# Which experiments scripts/05_run_all_evals.py runs.

k_values: [1, 5, 10, 20]
depth: 100                      # results kept per query in each run file

# E1 queries are whole IL-PCSR judgments: cap them to their 100 highest-idf terms
# (BM25F/tf-idf cost grows with query length; IL-PCSR's own BM25 used full text).
e1_max_query_terms: 100
ilpcsr_protocol: true           # F1@k with k chosen on the val split (IL-PCSR Table 3 protocol)

test_sets:
  e1_ilpcsr:                    # precedent retrieval, IL-PCSR test split
    queries: ilpcsr_test
    qrels: ilpcsr_test
    target: precedent
    val: ilpcsr_val             # used only to choose k
  e1s_ilpcsr_statutes:          # statute retrieval on the same queries
    queries: ilpcsr_test
    qrels: ilpcsr_test
    target: statute
    val: ilpcsr_val
  e2_collision:                 # rows may carry "wrong_refs": ["bns:302"] for the wrong-offence metric
    queries: data/queries/e2_collision.jsonl
    qrels: data/queries/qrels/e2_collision.tsv
    target: statute
  e3_cross_version:             # rows carry "source_query_id"; gold = that IL-PCSR test query's citations
    queries: data/queries/e3_cross_version.jsonl
    qrels: ilpcsr_test
    target: precedent
  e4_multilingual:              # rows carry "lang": en | hi | hinglish
    queries: data/queries/e4_multilingual.jsonl
    qrels: data/queries/qrels/e4_multilingual.tsv
    target: statute
  e6_jurisdiction:              # rows carry "state"; topical qrels graded into binding (2) / persuasive (1)
    queries: data/queries/e6_jurisdiction.jsonl
    qrels: data/queries/qrels/e6_jurisdiction.tsv
    target: precedent
  e7_temporal:                  # rows carry "incident_date"; scored on the code of the top statute
    queries: data/queries/e7_temporal.jsonl
    qrels: data/queries/qrels/e7_temporal.tsv
    target: statute

# Ablation ladder: each step switches on one more component (names match search.SearchOptions).
ablation_ladder:
  - {name: bm25,          zones: false, bridge: false, authority: false, dense: false, qpp: false, jurisdiction: false, code_filter: false}
  - {name: +zones,        zones: true,  bridge: false, authority: false, dense: false, qpp: false, jurisdiction: false, code_filter: false}
  - {name: +code_filter,  zones: true,  bridge: false, authority: false, dense: false, qpp: false, jurisdiction: false, code_filter: true}
  - {name: +bridge,       zones: true,  bridge: true,  authority: false, dense: false, qpp: false, jurisdiction: false, code_filter: true}
  - {name: +authority,    zones: true,  bridge: true,  authority: true,  dense: false, qpp: false, jurisdiction: false, code_filter: true}
  - {name: +dense,        zones: true,  bridge: true,  authority: true,  dense: true,  qpp: false, jurisdiction: false, code_filter: true}
  - {name: +qpp,          zones: true,  bridge: true,  authority: true,  dense: true,  qpp: true,  jurisdiction: false, code_filter: true}
  - {name: +jurisdiction, zones: true,  bridge: true,  authority: true,  dense: true,  qpp: true,  jurisdiction: true,  code_filter: true}
  - {name: +ltr,          zones: true,  bridge: true,  authority: true,  dense: true,  qpp: true,  jurisdiction: true,  code_filter: true, ltr: true}

# E4: analyzer steps switched on one at a time (stemming needs a re-index, so it is not ablated here)
language_ablation:
  - {name: none,      transliterate: false, lexicon: false, phonetic: false, dense: false}
  - {name: +translit, transliterate: true,  lexicon: false, phonetic: false, dense: false}
  - {name: +lexicon,  transliterate: true,  lexicon: true,  phonetic: false, dense: false}
  - {name: +phonetic, transliterate: true,  lexicon: true,  phonetic: true,  dense: false}
  - {name: +dense,    transliterate: true,  lexicon: true,  phonetic: true,  dense: true}

# Typo robustness (eval/typos.py): known-item search for statutes. Query = a statute's title
# with simulated typos; target = that statute. Spelling correction off vs on vs clean titles.
typos:
  n_items: 300                  # statutes sampled (with a title of 2+ content words)
  seed: 13
  rate: 1.0                     # expected typos per query (at least one)

efficiency:
  n_queries: 200                # E1 test queries timed per mode
  modes: [all, tiers, champions]

rag:
  questions: data/queries/rag_questions.jsonl
  generator: auto               # auto (Claude if ANTHROPIC_API_KEY is set, else extractive) | claude | extractive

outputs:
  runs: results/runs
  tables: results/tables
  figures: results/figures
