[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanoon-bridge"
version = "0.1.0"
description = "Legal search across the IPC to BNS change, with Hinglish queries and jurisdiction/temporal facets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "nltk>=3.8",
    "networkx>=3.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pdfplumber>=0.10",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
data = ["datasets>=2.14"]
dense = ["sentence-transformers>=2.2", "torch>=2.0"]
app = ["streamlit>=1.30"]
rag = ["anthropic>=0.30", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
